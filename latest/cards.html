<script>
// The rental deal math from the call. Everything is "first year" numbers.
//
// Question we answer for every listing:
//   What is the most an end buyer can pay and still get a 20% cash-on-cash
//   return in year one, AND still be buying at least $X under list price?
//   Then: can we get it under contract low enough to keep our assignment fee?

                                   
                                                      
                    
                              
                                                 
                                                                                    
                                
                                                            
                                                                             
 

                             
                                                               
                                         
                                                                                               
 

                                  
                    
                                            
                    
                                                                       
                      
 

                             
                    
                      
                    
                          
                              
                 
                                                                           
                                                                
                                                             
                                    
                                                                                                  
                                      
                               
                            
                              
                          
                     
                               
                 
 

function monthlyMortgage(price        , a                  )         {
  const loan = price * (1 - a.downPayment);
  const r = a.interestRate / 12;
  const n = a.loanYears * 12;
  if (loan <= 0) return 0;
  if (r === 0) return loan / n;
  return (loan * r) / (1 - Math.pow(1 + r, -n));
}

function annualCashFlow(price        , p                           , a                  )         {
  const netRent = p.monthlyRent * (1 - a.managementAndUpkeep);
  const monthly = netRent - monthlyMortgage(price, a) - p.annualTax / 12 - p.annualInsurance / 12 - p.monthlyHoa;
  return monthly * 12;
}

function cashInvested(price        , a                  )         {
  return price * (a.downPayment + a.closingCosts);
}

function cashOnCash(price        , p                           , a                  )         {
  return annualCashFlow(price, p, a) / cashInvested(price, a);
}

function bufferFor(listPrice        , rules            )         {
  const sorted = [...rules.buffers].sort((x, y) => x.upTo - y.upTo);
  for (const b of sorted) if (listPrice < b.upTo) return b.discount;
  return sorted[sorted.length - 1]?.discount ?? 0;
}

function estimateInsurance(listPrice        , a                  )         {
  return Math.max(a.insuranceMinAnnual, listPrice * a.insurancePctOfPrice);
}

// Cash-on-cash falls as price rises, so bisect for the highest price that still hits the target.
function maxPriceForCoc(p                           , a                  )         {
  let lo = 1;
  let hi = p.listPrice * 2;
  if (cashOnCash(lo, p, a) < a.minCashOnCash) return 0;
  if (cashOnCash(hi, p, a) >= a.minCashOnCash) return hi;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (cashOnCash(mid, p, a) >= a.minCashOnCash) lo = mid;
    else hi = mid;
  }
  return lo;
}

const round = (n        , to = 1) => Math.round(n / to) * to;

function analyze(input                 , a                  , rules            )             {
  const insuranceEstimated = input.annualInsurance == null;
  const p                            = {
    listPrice: input.listPrice,
    monthlyRent: input.monthlyRent,
    annualTax: input.annualTax,
    annualInsurance: input.annualInsurance ?? estimateInsurance(input.listPrice, a),
    monthlyHoa: input.monthlyHoa ?? 0,
  };
  const buffer = bufferFor(p.listPrice, rules);
  const maxPriceFor20pct = round(maxPriceForCoc(p, a), 100);
  const buyerMaxPrice = Math.max(0, Math.min(maxPriceFor20pct, p.listPrice - buffer));
  const ceilingOffer = round(buyerMaxPrice - rules.minAssignmentFee, 100);
  const floorOffer = round(p.listPrice * rules.floorPctOfList, 100);
  const feeAtFloor = buyerMaxPrice - floorOffer;

  const cf = annualCashFlow(buyerMaxPrice, p, a);
  const inv = cashInvested(buyerMaxPrice, a);

  let qualifies = ceilingOffer >= floorOffer && buyerMaxPrice > 0;
  let reason        ;
  if (maxPriceFor20pct === 0) {
    qualifies = false;
    reason = "Rent can't cover expenses for a 20% return at any price";
  } else if (!qualifies) {
    reason = `Buyer tops out at $${fmt(buyerMaxPrice)}; minus our $${fmt(rules.minAssignmentFee)} fee that's below the 70% floor of $${fmt(floorOffer)}`;
  } else if (maxPriceFor20pct < p.listPrice - buffer) {
    reason = `Cash flow limits the buyer to $${fmt(buyerMaxPrice)}`;
  } else {
    reason = `Buyer limited by the $${fmt(buffer)} under-list buffer to $${fmt(buyerMaxPrice)}`;
  }

  // Tier by how much room there is between our floor and ceiling offers, as a share of list.
  // A: lots of room (big fee possible). B: decent. C: barely works.
  let tier                     = null;
  if (qualifies) {
    const room = (ceilingOffer - floorOffer) / p.listPrice;
    tier = room >= 0.1 ? "A" : room >= 0.04 ? "B" : "C";
  }

  return {
    listPrice: p.listPrice,
    monthlyRent: p.monthlyRent,
    annualTax: round(p.annualTax),
    annualInsurance: round(p.annualInsurance),
    insuranceEstimated,
    buffer,
    maxPriceFor20pct,
    buyerMaxPrice: round(buyerMaxPrice, 100),
    ceilingOffer,
    floorOffer,
    feeAtFloor: round(feeAtFloor, 100),
    buyerMonthlyMortgage: round(monthlyMortgage(buyerMaxPrice, a)),
    buyerCashInvested: round(inv),
    buyerAnnualCashFlow: round(cf),
    buyerCashOnCash: inv > 0 ? Math.round((cf / inv) * 1000) / 1000 : 0,
    qualifies,
    tier,
    reason,
  };
}

// ---- Rental vs flip ----
// From the call: a house that's already fixed up goes to a rental buyer (judged by cash-on-cash);
// one that needs work goes to a fix-and-flip buyer (judged by flip profit).
// We can't see condition without photos, so we use price vs. RentCast's value estimate (ARV):
// listed well under what the house is worth fixed up = probably needs work = flip.
                                  
                                                                               
                                                                                              
                                                                                   
 

function dealType(listPrice        , value                    , f                 )                           {
  if (!value) return null;
  return listPrice <= value * f.flipIfListBelowValue ? "Flip" : "Rental";
}

function flipProfit(arv        , buyerPrice        , sqft                    , f                 ) {
  const rehab = (sqft ?? 0) * f.rehabPerSqft;
  const costs = arv * f.costsPctOfArv;
  return { rehab: Math.round(rehab), profit: Math.round(arv - buyerPrice - rehab - costs) };
}

function fmt(n        ) {
  return Math.round(n).toLocaleString("en-US");
}

const $ = (n)=>"$"+Math.round(n||0).toLocaleString();
const KEY = "deal-status";
let state = {}; try { state = JSON.parse(localStorage.getItem(KEY)||"{}") } catch {}
const save = ()=>{ try { localStorage.setItem(KEY, JSON.stringify(state)) } catch {} };
let filter = "todo";
const FILTERS = [["todo","To contact"],["A","Tier A"],["B","Tier B"],["C","Tier C"],["new","New today"],["done","Contacted / skipped"],["all","All"]];
function shown(d){ const s=state[d.id]?.status;
  if(filter==="todo") return !s; if(filter==="done") return !!s; if(filter==="new") return d.isNew; if(filter==="all") return true; return d.tier===filter; }
function smsBody(d){ return "Hi"+(d.agent?" "+d.agent.split(" ")[0]:"")+", I'm an investor interested in "+d.address+". Would your seller consider a cash offer around "+$(d.floorOffer)+" with a quick close?"; }
function render(){
  const list=document.getElementById("list"); const items=DATA.filter(shown);
  document.getElementById("count").textContent = DATA.length+" leads, "+DATA.filter(d=>!state[d.id]?.status).length+" not contacted";
  document.getElementById("filters").innerHTML = FILTERS.map(([k,l])=>'<button data-f="'+k+'" class="'+(k===filter?"on":"")+'">'+l+'</button>').join("");
  list.innerHTML = items.length ? "" : '<p class="sub">Nothing here.</p>';
  for(let d of items){
    const s=state[d.id]||{};
    const base=d; if(s.rent){ d={...base,...analyze({listPrice:base.listPrice,monthlyRent:s.rent,annualTax:base.annualTax,annualInsurance:base.annualInsurance,monthlyHoa:base.hoa},CFG.buyer,CFG.offer)}; }
    const el=document.createElement("div"); el.className="card"+(s.status?" done":"");
    const phone=(d.phone||"").replace(/[^0-9+]/g,"");
    el.innerHTML = '<div class="top"><div><div class="addr"></div><div class="meta"></div></div><span class="tier t'+(d.tier||"C")+'">'+(d.tier||"Out")+'</span></div>'+
      '<div class="grid"><div><span>List</span><b>'+$(d.listPrice)+'</b></div><div><span>Offer from</span><b>'+$(d.floorOffer)+'</b></div><div><span>Offer up to</span><b>'+$(d.ceilingOffer)+'</b></div>'+
      '<div><span>Buyer pays up to</span><b>'+$(d.buyerMaxPrice)+'</b></div><div><span>Your fee at floor</span><b>'+$(d.feeAtFloor)+'</b></div><div><span>Median rent'+(s.rent?' (Zillow)':'')+'</span><b>'+$(d.monthlyRent)+'/mo</b></div>'+
      '<div><span>Deal type</span><b>'+(d.dealType||"Unknown")+'</b></div>'+
      (d.dealType==="Flip"?'<div><span>Flip: buyer profit</span><b>'+$(d.flipProfit)+'</b></div><div><span>Value / ARV</span><b>'+$(d.arv)+'</b></div>':'<div><span>Rental: cash-on-cash</span><b>'+(d.buyerCashOnCash*100).toFixed(1)+'%</b></div><div><span>Value / ARV</span><b>'+(d.arv?$(d.arv):"n/a")+'</b></div>')+'</div>'+
      (s.rent&&!d.qualifies?'<div class="warn">With this rent it no longer works: '+d.reason+'</div>':'')+
      '<div class="rentrow"><button class="zr">Check rent on Zillow</button><input type="number" inputmode="numeric" placeholder="Zillow median rent" value="'+(s.rent||"")+'"><button class="clr">Reset</button></div>'+
      (d.cond?'<div class="cond"><b>'+d.cond+'</b>'+(d.condRehab!=null?' · about '+$(d.condRehab)+' rehab':'')+' <span class="sub">('+d.condConf+' confidence, from photos)</span><div class="sub cn"></div></div>':'')+
      '<details><summary>Buyer numbers at '+$(d.buyerMaxPrice)+'</summary><table>'+
      '<tr><td>Mortgage (P&amp;I)</td><td>'+$(d.buyerMonthlyMortgage)+'/mo</td></tr>'+
      '<tr><td>Property tax'+(d.taxEstimated?" (estimated)":"")+'</td><td>'+$(d.annualTax)+'/yr</td></tr>'+
      '<tr><td>Landlord insurance (estimated)</td><td>'+$(d.annualInsurance)+'/yr</td></tr>'+
      '<tr><td>Rent range</td><td>'+(d.rentLow?$(d.rentLow)+" to "+$(d.rentHigh):"n/a")+'</td></tr>'+
      '<tr><td>Cash in (down + closing)</td><td>'+$(d.buyerCashInvested)+'</td></tr>'+
      '<tr><td>Year one cash flow</td><td>'+$(d.buyerAnnualCashFlow)+'</td></tr>'+
      '<tr><td>Cash-on-cash</td><td>'+(d.buyerCashOnCash*100).toFixed(1)+'%</td></tr></table></details>'+
      '<div class="actions">'+(phone?'<a class="call" href="tel:'+phone+'">Call</a><a class="sms" href="sms:'+phone+'&body='+encodeURIComponent(smsBody(d))+'">Text</a>':'')+
      '<a href="'+d.url+'" target="_blank" rel="noopener">Photos</a><button data-s="contacted">Contacted</button><button data-s="skip">Skip</button></div>'+
      '<div class="status"></div><textarea rows="2" placeholder="Notes"></textarea>';
    el.querySelector(".addr").textContent = d.address;
    if(d.cond) el.querySelector(".cn").textContent = d.condNotes||"";
    el.querySelector(".meta").innerHTML = '';
    el.querySelector(".meta").append(d.city+", "+d.state+" "+(d.zip||"")+" · "+[d.type,d.beds&&d.beds+" bd",d.baths&&d.baths+" ba",d.sqft&&d.sqft.toLocaleString()+" sqft",d.dom!=null&&d.dom+" days listed"].filter(Boolean).join(" · ")+(d.agent?" · "+d.agent:""));
    if(d.isNew){const n=document.createElement("span");n.className="new";n.textContent="NEW";el.querySelector(".addr").append(n)}
    el.querySelector(".status").textContent = s.status ? (s.status==="skip"?"Skipped":"Contacted")+" "+s.at : "";
    el.querySelector(".zr").onclick=()=>{ const a=d.address+", "+d.city+", "+d.state+" "+(d.zip||""); try{navigator.clipboard.writeText(a)}catch{} window.open(ZILLOW_RENT,"_blank","noopener"); el.querySelector(".zr").textContent="Address copied, paste it on Zillow"; };
    const ri=el.querySelector(".rentrow input"); ri.onchange=()=>{ const v=Number(ri.value); state[d.id]={...state[d.id],rent:v>0?v:undefined}; save(); render(); };
    el.querySelector(".clr").onclick=()=>{ state[d.id]={...state[d.id],rent:undefined}; save(); render(); };
    const ta=el.querySelector("textarea"); ta.value=s.notes||""; ta.oninput=()=>{state[d.id]={...state[d.id],notes:ta.value};save()};
    el.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{state[d.id]={...state[d.id],status:b.dataset.s,at:new Date().toLocaleDateString()};save();render()});
    list.append(el);
  }
}
document.getElementById("filters").onclick=(e)=>{const f=e.target.dataset?.f;if(f){filter=f;render()}};
render();
</script></body></html>
