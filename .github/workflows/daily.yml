name: Daily deal scan

on:
  # Daily schedule paused while on RentCast's free plan (50 calls/month).
  # Turn it back on after upgrading: remove the # on the two lines below.
  # schedule:
  #   - cron: "0 11 * * *" # 6 AM Eastern (7 AM during daylight time)
  # Pushing new photos or rents/rents.json reruns the deal math right away, with no RentCast calls.
  push:
    branches: [main]
    paths: ["photos/**", "rents/rents.json"]
  workflow_dispatch:
    inputs:
      market:
        description: 'One market only, e.g. "Dayton, OH" (blank = all in config.json)'
        required: false
      limit:
        description: 'Listings to pull: 0 = no RentCast calls (reuse last scan, rate photos), 1 = about 4 calls, "all" = full scan'
        required: true
        default: "0"

# One run at a time, so two quick pushes don't both pay to rate the same photos.
concurrency:
  group: deal-scan
  cancel-in-progress: false

permissions:
  contents: write # to commit photos/needed.json

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # Rent + tax lookups are cached for 30 days so each run only pays for new listings.
      - uses: actions/cache@v4
        with:
          path: |
            data/cache.json
            data/usage.json
            data/ratings.json
            data/listings.json
          key: rentcast-${{ github.run_id }}
          restore-keys: rentcast-

      - name: Scan markets
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKET: ${{ inputs.market }}
          LIMIT: ${{ inputs.limit || '0' }}
        run: |
          if [ "$LIMIT" != "0" ] && [ -z "$RENTCAST_API_KEY" ]; then echo "Add the RENTCAST_API_KEY repo secret first"; exit 1; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY repo secret; photos won't be rated"; fi
          ARGS=()
          if [ -n "$MARKET" ]; then ARGS+=(--market "$MARKET"); fi
          if [ "$LIMIT" != "all" ]; then ARGS+=(--limit "${LIMIT:-1}"); fi
          node src/run.ts "${ARGS[@]}"

      # Save the list of houses that need photos into the repo (photos/needed.json).
      # Pushes made with the workflow's own token don't start another run.
      - name: Update photos/needed.json and rents/needed.json
        run: |
          cp out/needed.json photos/needed.json
          mkdir -p rents && cp out/rents-needed.json rents/needed.json
          git config user.name "deal-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/needed.json rents/needed.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update photos/needed.json and rents/needed.json"
          git pull --rebase -q && git push

      - uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: out/
          retention-days: 30
