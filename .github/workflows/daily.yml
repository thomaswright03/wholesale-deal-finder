name: Daily deal scan

on:
  # Daily schedule paused while on RentCast's free plan (50 calls/month).
  # Turn it back on after upgrading: remove the # on the two lines below.
  # schedule:
  #   - cron: "0 11 * * *" # 6 AM Eastern (7 AM during daylight time)
  workflow_dispatch:
    inputs:
      market:
        description: 'One market only, e.g. "Dayton, OH" (blank = all in config.json)'
        required: false
      limit:
        description: 'Test mode: only pull this many listings and show them all (1 = about 4 API calls). Blank = normal scan'
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # Rent + tax lookups are cached for 30 days so each run only pays for new listings.
      - uses: actions/cache@v4
        with:
          path: |
            data/cache.json
            data/usage.json
          key: rentcast-${{ github.run_id }}
          restore-keys: rentcast-

      - name: Scan markets
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          MARKET: ${{ inputs.market }}
          LIMIT: ${{ inputs.limit }}
        run: |
          if [ -z "$RENTCAST_API_KEY" ]; then echo "Add the RENTCAST_API_KEY repo secret first"; exit 1; fi
          ARGS=()
          if [ -n "$MARKET" ]; then ARGS+=(--market "$MARKET"); fi
          if [ -n "$LIMIT" ]; then ARGS+=(--limit "$LIMIT"); fi
          node src/run.ts "${ARGS[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: out/
          retention-days: 30
