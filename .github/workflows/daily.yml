name: Daily deal scan

on:
  # Daily scan. Sized for RentCast's free plan: rent comes from your own script (rents/rents.json),
  # so a day is 1 call per market for listings (rentcastListingsOnly), capped by
  # maxApiCallsPerMonth (50) in config.json. When the month's calls are used up it makes 0 calls.
  schedule:
    - cron: "0 11 * * *" # 6 AM Eastern (7 AM during daylight time)
  # Each run also looks up rent + tax for new houses with tools/rent.py (Property Genie) and commits rents/rents.json.
  # Pushing new photos or rents/rents.json reruns the deal math right away, with no RentCast calls.
  push:
    branches: [main]
    paths: ["photos/**", "rents/rents.json"]
  workflow_dispatch:
    inputs:
      market:
        description: 'One market only, e.g. "Dayton, OH" (blank = all in config.json)'
        required: false
      limit:
        description: 'Listings to pull: 0 = no RentCast calls (reuse last scan, rate photos), 1 = about 4 calls, "all" = full scan'
        required: true
        default: "0"

# One run at a time, so two quick pushes don't both pay to rate the same photos.
concurrency:
  group: deal-scan
  cancel-in-progress: false

permissions:
  contents: write # to commit photos/needed.json

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      # Rent + tax lookups are cached for 30 days so each run only pays for new listings.
      - uses: actions/cache@v4
        with:
          path: |
            data/cache.json
            data/usage.json
            data/ratings.json
            data/listings.json
          key: rentcast-${{ github.run_id }}
          restore-keys: rentcast-

      - name: Scan markets
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKET: ${{ inputs.market }}
          LIMIT: ${{ github.event_name == 'schedule' && 'all' || inputs.limit || '0' }}
        run: |
          # No RentCast key: don't fail, just reuse the last scan's listings (0 calls).
          if [ "$LIMIT" != "0" ] && [ -z "$RENTCAST_API_KEY" ]; then echo "No RENTCAST_API_KEY secret; reusing the last scan's listings"; LIMIT=0; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY repo secret; photos won't be rated"; fi
          ARGS=()
          if [ -n "$MARKET" ]; then ARGS+=(--market "$MARKET"); fi
          if [ "$LIMIT" != "all" ]; then ARGS+=(--limit "${LIMIT:-1}"); fi
          node src/run.ts "${ARGS[@]}"

      # Rent + property tax from Property Genie (tools/rent.py), for houses not checked in the last 30 days.
      # Capped at 45 minutes a run; anything left over is picked up the next run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Off for now: Property Genie shows a Cloudflare bot check to GitHub's servers, so every lookup fails.
      # Set the repo variable RUN_RENT_LOOKUP=true to turn it back on.
      - name: Look up rents and taxes (tools/rent.py)
        id: rents
        if: vars.RUN_RENT_LOOKUP == 'true'
        continue-on-error: true
        timeout-minutes: 60
        run: |
          mkdir -p rents && cp out/rents-needed.json rents/needed.json
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          before=$(sha1sum rents/rents.json 2>/dev/null || true)
          python -u tools/rent.py --max-minutes 45
          after=$(sha1sum rents/rents.json 2>/dev/null || true)
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # New taxes/rents: redo the deal math on the same listings (0 RentCast calls; photo ratings are cached).
      - name: Re-score with the new rents and taxes
        if: steps.rents.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MARKET: ${{ inputs.market }}
        run: |
          ARGS=(--limit 0)
          if [ -n "$MARKET" ]; then ARGS+=(--market "$MARKET"); fi
          node src/run.ts "${ARGS[@]}"

      # Save the list of houses that need photos into the repo (photos/needed.json).
      # Pushes made with the workflow's own token don't start another run.
      # Also keep the newest spreadsheet and cards at a fixed spot: latest/leads.xlsx and latest/cards.html.
      - name: Update needed.json files and latest/
        run: |
          cp out/needed.json photos/needed.json
          mkdir -p rents && cp out/rents-needed.json rents/needed.json
          mkdir -p latest && cp out/latest.html latest/cards.html && cp "$(ls -t out/leads-*.xlsx | head -1)" latest/leads.xlsx
          git config user.name "deal-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/needed.json rents/needed.json rents/rents.json taxes/county.json latest/
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update leads, rents/taxes, photos/needed.json and rents/needed.json"
          git pull --rebase -q && git push

      # Morning email with the spreadsheet and cards attached (daily scan only).
      # Turns on once these repo secrets exist: MAIL_USERNAME + MAIL_PASSWORD (a Gmail address and
      # its app password) and MAIL_TO (comma-separated recipients).
      - name: Email the leads
        if: github.event_name == 'schedule' && env.MAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Deal Finder <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: Wholesale leads for today
          body: Today's leads are attached. Open cards.html on your phone for call cards.
          attachments: latest/leads.xlsx,latest/cards.html

      - uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: out/
          retention-days: 30
